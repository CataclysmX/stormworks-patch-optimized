; stwpatch configuration (read at game start)

[vehicle]
; Worker threads for the per-vehicle simulation tick (originally ONE "vehicle_tick" thread).
; 0 = disable and keep the original behaviour. Default: CPU count - 3, between 2 and 8.
;threads=6
; Win32 priority of the workers (1 = ABOVE_NORMAL, 0 = NORMAL)
priority=1

[memory]
; 1 = enable the allocation tracker (memory leak diagnostic). Writes stwpatch_heap.txt
; to the game folder. Small CPU cost; leave at 0 for normal play.
track=0
; one allocation out of N is tracked (allocations >= 256 KiB are always tracked)
sample=64
report_seconds=60

[misc]
; text added to the version shown in the main menu ("v1.15.23 64Bit Cata-ptimised").
; Visual only: the version used for multiplayer compatibility is never changed. Empty = off.
version_suffix=Cata-ptimised
; timeBeginPeriod(1): 1 ms Sleep granularity (the game polls with Sleep(1) in several places)
timer_1ms=1

[physics]
; 1 = write stwpatch_physics.txt every report_seconds: Bullet phase timings (from the game's own
; Bullet profiler), body/contact counts, and how long the main thread waits for physics/vehicles.
profile=1
report_seconds=10
; Solver tuning (0 = game default). Bullet runs 10 iterations, always, because the game sets no
; convergence threshold. A residual threshold lets the solver stop early once contacts are solved.
; Suggested trial: solver_residual=0.00001  (then compare stwpatch_physics.txt)
; Fewer iterations = faster but softer/bouncier contacts (e.g. 6-8).
; Parallel narrowphase (collision detection between pairs of objects, usually the biggest
; physics cost with many vehicles). 0 = off (original single-threaded behaviour).
; Default: CPU count / 2 - 1, between 2 and 8.
;narrowphase_threads=7
; below this many overlapping pairs the pass stays single-threaded (thread wake-up cost)
narrowphase_min_pairs=64
; Bullet rate. The game switches between 180/120/60 Hz (3/2/1 substeps per tick) by itself,
; but its governor rarely reacts, so under load it stays at 180 Hz.
;   0  = leave it to the game
;   60 / 120 / 180 = forced (60 = 3x cheaper than 180, joints a bit less stiff)
;   -1 = stwpatch governor: highest rate whose step time fits in budget_ms
rate=-1
; governor target, ms of physics per tick (16.7 ms = the whole 60 Hz frame)
budget_ms=12
solver_iterations=0
solver_residual=0

[network]
; Multiplayer when you host in game. The game sends everything through Steam's
; SteamNetworkingMessages, whose sessions use Steam's global limits (the game never sets them).
; monitor=1 writes stwpatch_net.txt every 10 s: per player ping, quality, KB/s sent,
; the send rate Steam really uses, bytes waiting and queue time, refused sends.
monitor=1
; Ceilings (safe to raise): Steam send buffer and maximum send rate. 0 = Steam default.
send_buffer_kb=4096
send_rate_max_kb=4096
; Floor of the send rate. Steam's default is min = max = 256 KB/s per player, so the floor IS
; the limit. Your upload must carry about (rate x number of players) when the host has a lot to
; send: 512 KB/s x 4 players = 16 Mbit/s. Lower it if your upload is small, raise it (1024) if
; stwpatch_net.txt shows the queue growing at "rate KB/s" 512. 0 = Steam default.
send_rate_min_kb=512
